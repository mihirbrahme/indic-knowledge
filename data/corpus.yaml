  - id: aitareya-brahmana
    title: Aitareya Brahmana
    title_devanagari: ऐतरेयब्राह्मण
    family: brahmana
    veda: rigveda
    branch: null
    shakha: aitareya
    recension: null
    language: sanskrit
    citation_scheme: [panchika, adhyaya, khanda]
    citation_scheme_alt:
      - name: continuous-adhyaya-numbering
        levels: [adhyaya, khanda]
        notes: >-
          Editions also number the adhyayas continuously across the whole work
          rather than within each panchika. The mapping must be confirmed
          against the registered edition before either scheme is used.
    citation_scheme_review: true
    scope_notes:
      - The principal Rigvedic Brahmana, chiefly concerned with the soma rites and the royal consecration.
      - Both the panchika-based and the continuous adhyaya numbering are in use; see citation_scheme_alt.
      - EDITION BASIS RESOLVED - the registered digital witness descends from Aufrecht's edition of 1879, established from the Sanskrit Library catalogue record because TITUS itself states no edition.
