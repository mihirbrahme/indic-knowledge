  - id: shatapatha-brahmana-madhyandina
    title: Shatapatha Brahmana - Madhyandina recension
    title_devanagari: शतपथब्राह्मण (माध्यन्दिन)
    family: brahmana
    veda: yajurveda
    branch: shukla
    shakha: madhyandina
    recension: madhyandina
    language: sanskrit
    citation_scheme: [kanda, adhyaya, brahmana, kandika]
    citation_scheme_review: false
    scope_notes:
      - The most extensive Brahmana, carrying substantial narrative and speculative material alongside ritual exposition.
      - Kanda 14 contains the Brihadaranyaka material; see brihadaranyaka-upanishad-madhyandina.
      - Kanda numbering differs from the Kanva recension; references must state the recension.
      - COVERAGE GAP - the GRETIL files omit kanda 12 entirely. The TITUS presentation is complete, but its associated retrieval interface also covers only books 1-11 and 13-14. Any kanda 12 passage must come from Weber's printed edition, and the gap must be stated.
      - SOURCE LIMITATION - GRETIL and TITUS share the Vedavid lineage through J. R. Gardner, so they are not independent witnesses.
    priority: high
    status: approved
    sources:
