  # ---------------------------------------------------------------
  # Q. Ayurveda
  #
  # Standing requirement for this family, from AGENTS.md and CLAIM_POLICY.md:
  # these texts may be described and analysed as historical medical thought.
  # Nothing in them is modern clinical evidence, and no historical prescription
  # may be turned into medical advice. Historical medical theory, historical
  # observation, traditional therapeutic claim, laboratory evidence, clinical
  # evidence, and current medical consensus are six distinct things and must
  # stay distinct in any entry.
  #
  # CLAIM_POLICY.md names dosha equals modern physiological system and agni
  # equals metabolism among its dangerous automatic equivalences. Such
  # comparisons may be explored; equivalence must never be assumed.
  #
  # All three compendia are layered, redacted works. Which stratum a passage
  # falls in is material to any historical claim about it.
  # ---------------------------------------------------------------

