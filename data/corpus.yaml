    source_status: partially-verified

  - id: kaushitaki-shankhayana-brahmana
    title: Kaushitaki Brahmana (Shankhayana Brahmana)
    title_devanagari: कौषीतकिब्राह्मण
    family: brahmana
    veda: rigveda
    branch: null
    shakha: kaushitaki-shankhayana
    recension: null
