  # ---------------------------------------------------------------
  # E. Vedanga - shiksha and the phonetic tradition
  #
  # Shiksha works and Pratishakhyas are not one genre. A Pratishakhya is a
  # descriptive phonetic treatise tied to the recitation of one specific
  # shakha's Samhita, stating the rules that text actually observes. A Shiksha
  # work is a shorter didactic manual of pronunciation, generally not bound to
  # a single shakha. They share a subject, not a literary form, and the
  # distinction must not be flattened in any entry drawn from them.
  # ---------------------------------------------------------------

  - id: paniniya-shiksha
