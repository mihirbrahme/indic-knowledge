    scope_notes:
      - A large astronomical treatise whose mathematical chapters contain some of the earliest systematic surviving rules for operating with zero and with negative quantities, and for indeterminate equations.
      - PRECISION REQUIRED ON ZERO - the text states rules for arithmetic involving zero, and some of them, including its treatment of division by zero, do not agree with modern mathematics. Presenting the chapter as the invention of zero, or as anticipating modern results, misstates what it does. Describe the rules as given, note which correspond to modern results and which do not, and source any priority claim separately.
