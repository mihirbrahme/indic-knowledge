    citation_scheme: [adhyaya, khanda]
    citation_scheme_review: false
    scope_notes:
      - The two names denote the same work in standard scholarship; both must be retained as title variants rather than treated as two texts.
      - The second Rigvedic Brahmana alongside aitareya-brahmana, with which it overlaps in subject but not in wording.
      - SOURCE POSITION - the strongest independence position among the Brahmanas. GRETIL and TITUS carry SEPARATE transcriptions, by Tokunaga and Kupfer respectively, rather than one shared file. The TITUS copy is members-only, so the independent route is structural rather than practically usable.
      - The digital witness states no printed edition, which is what keeps this text below verified despite two good printed anchors.
    priority: specialist
