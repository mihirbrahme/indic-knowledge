  # R. Jyotisha - mathematical astronomy
  #
  # Standing requirement, from CLAIM_POLICY.md: distinguish observation,
  # computational rule, predictive model, cosmology, and reference frame. A
  # rule that computes correctly does not validate the cosmology around it, and
  # a correct value does not establish the reasoning that produced it.
  #
  # These texts are the most frequent site of overstated priority claims in
  # popular writing. Any assertion that a text anticipated, discovered, or
  # established a modern result requires history-of-science sourcing, must
  # identify the exact shared proposition, and must say where the
  # correspondence stops.
  # ---------------------------------------------------------------

