    scope_notes:
      - A treatise on the acquisition and maintenance of state power, covering administration, revenue, law, intelligence, and interstate policy in unusual practical detail.
      - MODERN EDITORIAL HISTORY - the work was not in continuous scholarly circulation in the modern period and re-entered it through manuscript discovery in the twentieth century. The text now used rests on that editorial and critical work, and the standard sutra numbering is an editorial apparatus rather than a received one.
      - Citations must therefore be edition-aware and must name the edition; numbering differs between editions and cannot be carried between them.
      - ATTRIBUTION AND DATE MUST NOT BE COLLAPSED - the traditional identification of the author with the minister of the first Maurya ruler is one thing; the modern scholarly account, which treats the surviving text as composite, worked over across a long period, and later than that tradition would place it, is another. Both may be reported, each labelled, and neither may be presented as confirming the other.
      - Its administrative detail is prescriptive and idealising. It is not a record of how any state actually operated, and using it as direct evidence of historical practice is a HISTORICAL claim requiring independent sourcing.
      - Contains material on coercion, surveillance, and punishment that must be quoted accurately and contextualised rather than either sanitised or sensationalised.
      - SOURCE POSITION - SARIT holds a dedicated TEI file with a working web view under liberal terms, anchored to Kangle's critical edition of 1960-1965, which is the source of the now-standard sutra numbering.
      - THE NUMBERING IS A MODERN EDITORIAL APPARATUS, not a received division, so citations must name Kangle where precision matters.
      - IDENTITY AND DATE STAY OPEN. The traditional equation of Kautilya, Chanakya and Vishnugupta, and the traditional Maurya association, are traditional claims; modern scholarship treats the surviving text as composite. Neither account is asserted in metadata.
