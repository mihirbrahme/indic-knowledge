  - id: rigveda-samhita-shakala
    title: Rigveda Samhita
    title_devanagari: ऋग्वेदसंहिता
    family: veda-samhita
    veda: rigveda
    branch: null
    shakha: shakala
    recension: shakala
    language: sanskrit
    citation_scheme: [mandala, sukta, mantra]
    citation_scheme_alt:
      - name: ashtaka-system
        levels: [ashtaka, adhyaya, varga, mantra]
        notes: >-
          A parallel division of the same text in wide editorial use. References
          must be mapped between the two schemes, never substituted.
    citation_scheme_review: false
    scope_notes:
      - The only Rigvedic recension surviving as a complete text; other shakhas are known mainly by report.
      - Both the mandala and ashtaka divisions are in active use; see citation_scheme_alt.
      - Accent is integral to the transmission and must never be silently dropped or normalised. The registered primary witness preserves accent; this was verified.
    priority: high
    status: approved
    sources:
      primary:
        - sr-rigveda-shakala-gretil
      verification:
        - sr-rigveda-shakala-titus
      edition_anchors:
        - sr-rigveda-shakala-aufrecht-scan
      audio:
        - sr-rigveda-shakala-vedicheritage-audio
    source_status: verified

  - id: atharvaveda-samhita-shaunaka
    title: Atharvaveda Samhita - Shaunaka recension
    title_devanagari: अथर्ववेदसंहिता
    family: veda-samhita
    veda: atharvaveda
    branch: null
    shakha: shaunaka
    recension: shaunaka
    language: sanskrit
    citation_scheme: [kanda, sukta, mantra]
    citation_scheme_alt:
      - name: prapathaka-division
        levels: [prapathaka, anuvaka, sukta, mantra]
        notes: >-
          A parallel structural division carried in some editions. It is not the
          form in general citation use; confirm its levels against the
          registered edition before relying on it.
      - name: vishva-bandhu-numbering
        levels: [kanda, sukta, mantra]
        notes: >-
          Books 11-20 are numbered differently in the Vishva Bandhu edition,
          Hoshiarpur 1960-1964, from the Roth and Whitney numbering. The
          registered digital witness records cross-references between the two.
          References in those books must state which numbering is meant.
    citation_scheme_review: true
    scope_notes:
      - The vulgate Atharvaveda; a parallel prapathaka division exists in some editions, recorded in citation_scheme_alt.
      - Materially distinct from the Paippalada recension in content, order, and numbering; the two must never be cited interchangeably.
      - CITATION CORRECTION - books 11-20 carry divergent numbering between the Roth and Whitney edition and the Vishva Bandhu edition, Hoshiarpur 1960-1964. citation_scheme_review was raised to true on discovering this; a reference in those books is ambiguous unless the edition is stated.
      - SOURCE LIMITATION - the only registered digital witness has had its accents dropped. No entry may present its text as the accented tradition, and accent questions must go to the printed edition or the recitation.
    priority: high
    status: approved
    sources:
      primary:
        - sr-av-shaunaka-gretil
      edition_anchors:
        - sr-av-shaunaka-roth-whitney-anchor
      audio:
        - sr-av-shaunaka-vedicheritage-audio
    source_status: partially-verified

  - id: atharvaveda-samhita-paippalada
    title: Atharvaveda Samhita - Paippalada recension
    title_devanagari: अथर्ववेदसंहिता (पैप्पलाद)
    family: veda-samhita
    veda: atharvaveda
    branch: null
    shakha: paippalada
    recension: paippalada
    language: sanskrit
    citation_scheme: [kanda, sukta, mantra]
    citation_scheme_review: true
    scope_notes:
      - An independent recension, not a variant reading of the Shaunaka text; overlapping material is differently arranged and numbered.
      - Transmitted through distinct manuscript traditions (Kashmiri and Odia) whose readings diverge materially.
      - Modern editions of the several kandas differ in numbering and completeness; the citation scheme must be fixed against the specific edition before any passage is cited.
      - SOURCE LIMITATION - the registered digital witness is explicitly heterogeneous across kandas, with some kandas revised against modern critical editions and others still resting on much older electronic text. The per-kanda state must be checked before a passage is cited; evidential weight is not uniform across this text.
    priority: specialist
    status: approved
    sources:
      primary:
        - sr-av-paippalada-gretil
      edition_anchors:
        - sr-av-paippalada-bhattacharya-anchor
    source_status: partially-verified

  - id: vajasaneyi-samhita-madhyandina
    title: Vajasaneyi Samhita - Madhyandina recension
    title_devanagari: वाजसनेयिसंहिता (माध्यन्दिन)
    family: veda-samhita
    veda: yajurveda
    branch: shukla
    shakha: madhyandina
    recension: madhyandina
    language: sanskrit
    citation_scheme: [adhyaya, mantra]
    citation_scheme_review: false
    scope_notes:
      - The Shukla Yajurveda mantra collection, separating mantra from the Brahmana prose that the Krishna Yajurveda intermixes.
      - Adhyaya 40 constitutes the Isha Upanishad in this recension; see isha-upanishad-madhyandina.
      - Numbering differs from the Kanva recension at several points and must not be cross-applied.
      - SOURCE NOTE - the registered digital witness is explicitly labelled Madhyandina at source, which was verified. It states no edition basis, so its relationship to Weber's printed text is unestablished.
    priority: medium
    status: approved
    sources:
      primary:
        - sr-vs-madhyandina-titus
      edition_anchors:
        - sr-vs-madhyandina-weber-anchor
    source_status: partially-verified

  - id: vajasaneyi-samhita-kanva
    title: Vajasaneyi Samhita - Kanva recension
    title_devanagari: वाजसनेयिसंहिता (काण्व)
    family: veda-samhita
    veda: yajurveda
    branch: shukla
    shakha: kanva
    recension: kanva
    language: sanskrit
    citation_scheme: [adhyaya, mantra]
    citation_scheme_review: false
    scope_notes:
      - Differs from the Madhyandina recension in readings, arrangement, and verse numbering.
      - Its concluding adhyaya carries the Kanva form of the Isha Upanishad, which differs from the Madhyandina form in verse order and count; see isha-upanishad-kanva.
      - SOURCE GAP - no digital witness to this recension was located. GRETIL lists no Vajasaneyi Samhita at all; the TITUS Vajasaneyi text was inspected and is the MADHYANDINA recension, so it must never be used here. The Vedic Heritage Portal page for this recension was inspected and is an empty index carrying no text.
      - Only printed anchors exist. Passage work on this text is blocked until a Kanva witness is registered; the Weber volume presents Kanva alongside Madhyandina, so any use of it must state which sakha is being read.
    priority: specialist
    status: approved
    sources:
      edition_anchors:
        - sr-vs-kanva-weber-anchor
        - sr-vs-kanva-sharma-anchor
    source_status: source-gap

