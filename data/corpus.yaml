      - CLASSIFICATION UPHELD - TITUS shelves this work as a Vaisnava-Dharmasutra and older literature sometimes groups it with the Dharma Sutras. A repository's shelving is not evidence of date or genre, and the dharmashastra classification recorded here stands. Olivelle's critical edition and translation treats it as a Dharmashastra.
