version: 1
updated: 2026-09-21
status: active

# Source authority layer for Corpus v1.
#
# An AUTHORITY is an institution or project that publishes texts, editions,
# scans, or scholarship. Registering an authority does NOT approve any text or
# any individual source. It records that the authority has been inspected and
# is judged fit to supply source records of stated kinds.
#
# A SOURCE_RECORD maps one specific resource at one authority to one approved
# text in data/corpus.yaml. No source records exist yet: this file establishes
# the authority layer and the schema only, and text-to-URL mapping is a
# separate, later process. Every approved text remains source_status: pending.
#
# VERIFICATION RULE (SOURCE_POLICY.md)
#
# For a canonical passage, prefer:
#   1. one primary digital witness;
#   2. one independent verification witness;
#   3. one edition anchor where available.
#
# Two websites do not count as independent verification when they derive from
# the same electronic transcription. This is not hypothetical here. GRETIL and
# TITUS share contributors and underlying e-texts for several Vedic works - the
# van Nooten and Holland Rigveda data, for instance, stands behind material at
# more than one of the registered authorities. Before two sources are recorded
# as independent witnesses to the same passage, the transcription lineage of
# each must be checked, and `derived_from_transcription` recorded on the source
# record where a shared origin is found.
#
# An edition anchor is normally a printed critical or scholarly edition, not a
# website. A scan of that edition is an anchor; a website that silently follows
# it is not.
#
# LICENSING PRINCIPLE (SOURCE_POLICY.md)
#
# The ancient text may be in the public domain while the transcription,
# edition, translation, apparatus, or encoding is not. Licensing is recorded
# per authority below and must be re-checked per source record. Where an
# authority forbids reproduction, we store metadata, exact references, our own
# notes, and short attributed excerpts - never a bulk copy.

# Controlled vocabulary for source_record.source_role. A source may hold more
# than one role, so the field takes a list.
source_role_vocabulary:
  - primary-digital-witness
  - independent-verification
  - edition-anchor
  - machine-readable-witness
  - commentary-witness
  - translation-reference
  - audio-witness
  - manuscript-reference
  - scholarly-secondary-reference

# Fields each future source_record should support. Recorded structurally so
# that records can be validated against it when mapping begins.
source_record_schema:
  - id
  - authority_id
  - text_id
  - source_role
  - title
  - url
  - edition_basis
  - editor
  - publisher
  - publication_year
  - digital_transcription_by
  - language
  - script
  - recension
  - coverage
  - citation_scheme
  - provides_original_text
  - provides_translation
  - provides_commentary
  - provides_audio
  - machine_readable
  - licence
  - reuse_status
  - accessed_on
  - quality_notes
  - limitations
  # Added when the Veda Samhita records were built, because inspection showed
  # that several apparently separate repositories carry the same underlying
  # transcription and would otherwise have been counted as independent.
  - derived_from_transcription
  - independence_status
  - independence_scope
  # Added after the Vedic sourcing passes, which showed that
  # independence_status alone could not distinguish a witness resting on a
  # different edition from one merely typed by a different person.
  - independence_type

# independence_type - WHAT KIND of independence a witness has. Controlled
#   values, strongest first:
#     edition-independent - ultimately derives from a materially separate
#       printed or critical edition, or from an independently constituted text
#       such as a distinct pada or recitational form.
#     transcription-independent - the digital transcription was independently
#       created, but the underlying printed edition is the same as another
#       witness, OR is unstated. See the reading rule below.
#     manuscript-independent - rests on a distinct manuscript tradition or on
#       independently consulted manuscript evidence. Assign ONLY where the
#       source documentation genuinely supports it; no record in this registry
#       currently qualifies.
#     derivative - copied, transformed, normalised or reformatted from another
#       electronic transcription.
#     uncertain - lineage cannot currently be established at all, including
#       cases where even separate authorship of the transcription is unknown.
#
#   READING RULE FOR UNSTATED EDITIONS. Most witnesses in this registry name
#   no printed edition. Where separate authorship of the transcription IS
#   documented but the edition is not, the record is typed
#   transcription-independent and its independence_scope says the edition is
#   unstated. This credits only what the evidence shows. It must NOT be read
#   as establishing that the editions are the same, nor that they differ:
#   edition-independence is unproven, not disproven.
#
#   HOW THE THREE INDEPENDENCE FIELDS DIFFER:
#     independence_status - WHETHER this witness may be used as independent
#       verification at all: independent / derivative / uncertain. Retained;
#       it is what the validators enforce.
#     independence_type   - WHAT KIND of independence, per the values above.
#       It refines independence_status rather than replacing it. A record may
#       be independence_status: independent while being only
#       transcription-independent, which is the common case here.
#     independence_scope  - WHERE the independence applies: the textual range,
#       component, or qualification limiting it. Free text.
#   All three are retained; none supersedes another.

# WHAT THIS REGISTRY IS FOR
#
# The registry exists to tell us what source we are using, what edition or
# transcription it represents, what its limitations are, and whether further
# checking is desirable. It is a record of what we know about our evidence.
#
# It is NOT a gate that a text must pass before editorial work may begin.
# Proving multiple independent textual witnesses is not a precondition for
# research. Under the readiness model in SOURCE_POLICY.md, one credible and
# identifiable source that matches the intended text and recension is enough
# to move a text into editorial research.
#
# VERIFICATION IS PROPORTIONAL TO THE CLAIM. The chain a passage needs
# depends on what an entry argues from it, not on the text's fame or
# obscurity. SOURCE_POLICY.md lists the conditions that call for more.
#
# PROVENANCE FIELDS ARE OPTIONAL. independence_status, independence_type,
# independence_scope and derived_from_transcription remain valuable and are
# retained wherever recorded. They are NOT mandatory before a text can be
# used editorially, and research effort should not be spent filling them for
# completeness alone. Populate them when the evidence is readily to hand -
# typically when a file header or catalogue record is being read anyway.
#
# READING THE EXISTING source_status VALUES. Corpus records continue to carry
# verified / partially-verified / source-gap. Going forward:
#   verified and partially-verified - BOTH usable for editorial work. The
#     distinction records how strong the evidence chain is, not whether the
#     text may be worked on.
#   source-gap - further source research is needed before the text is used
#     for a canonical passage.
# The vocabulary may be simplified later. No migration has been performed,
# and no existing status has been rewritten to the readiness terms.

# SOURCE READINESS MODEL - the practical classification, per SOURCE_POLICY.md.
source_readiness_model:
  - id: usable
    requires:
      - at least one credible source clearly corresponding to the intended text and recension
      - identifiable institutional, scholarly, or edition provenance
      - passages locatable reliably enough for research
    notes: >-
      Sufficient to begin editorial work. One good source is enough; a second
      independent witness is not required to classify a text usable.
  - id: well-supported
    requires:
      - a usable source
      - plus one or more of - another useful textual witness, a printed or critical edition anchor, an institutional repository, or a commentary or translation useful for interpretation
    notes: >-
      The comfortable position. Most corpus records currently marked
      partially-verified sit here.
  - id: source-gap
    requires:
      - no sufficiently trustworthy or identifiable source for reliable passage-level work
    notes: >-
      Includes the case where the only strong source is for the WRONG
      recension. Matching matters more than quality; see SOURCE_POLICY.md.

# SOURCE-CHAIN QUALITY MODEL - documented for future use.
#
# This describes how STRONG a chain is, where the readiness model above
# describes whether it is WORKABLE. A transcription-verification chain is
# usable; the label records what that verification does and does not prove.
#
# This is NOT yet the vocabulary of corpus source_status, which continues to
# use verified / partially-verified / source-gap. It is recorded here so that
# chains can be assessed consistently, and so that a later migration has a
# definition to migrate to. No corpus record has been renamed to these values.
source_chain_quality_model:
  - id: strong-verification
    requires:
      - a usable primary digital witness
      - at least one verification route typed edition-independent or manuscript-independent
      - edition basis adequately understood
    notes: >-
      The verification route must rest on a materially separate edition or on
      manuscript evidence. This is the only level at which agreement between
      witnesses is evidence about the TEXT rather than about the accuracy of
      copying.
  - id: transcription-verification
    requires:
      - a usable primary digital witness
      - an independently created digital transcription
      - but a shared, or unproven, underlying printed edition
    notes: >-
      Checks that the digital texts faithfully reproduce their source. It does
      NOT check independent textual constitution, and an error in the shared
      edition passes through both witnesses undetected. An entry resting on
      such a chain may state what the edition reads, not what the text reads.
  - id: partial-verification
    requires:
      - a useful source chain exists
      - but a required element is missing, inaccessible, derivative, uncertain, or edition-dependence is unresolved
    notes: >-
      Includes the common case where no printed edition is identified anywhere
      in the chain, so the digital texts cannot be checked against a page.
  - id: source-gap
    requires:
      - the evidence chain is inadequate for canonical passage work
    notes: >-
      No usable primary witness, or no route to a text at all. Passage work is
      blocked.

# derived_from_transcription - where a source's text descends from another
#   transcription rather than from an independent reading of an edition.
#   Takes a source-record id where the ancestor is registered here, a named
#   transcription or project where the ancestor is external, or null where
#   independence is verified or no derivation is known. null means "no known
#   derivation", NOT "confirmed independent" - that is what
#   independence_status records.
#
# independence_status - controlled values:
#   independent - inspected and judged to rest on its own transcription of an
#     edition, so it may serve as an independent verification witness.
#   derivative  - inspected and shown to descend from another transcription
#     registered or named here. It must NOT be counted as independent
#     verification of the source it descends from.
#   uncertain   - lineage not established, usually because the source states
#     no edition basis or could not be inspected. Treat as NOT independent
#     until resolved.
#
# independence_scope - optional. Present where a source bundles several text
#   components whose lineages differ, so that independence holds for part of it
#   only. Where present it NARROWS independence_status, and a verification
#   check must use the component it names.

authorities:
  - id: vedic-heritage-portal
    name: Vedic Heritage Portal
    institution: Indira Gandhi National Centre for the Arts (IGNCA)
    parent_institution: Ministry of Culture, Government of India
    country: India
    authority_type: national-institutional-repository
    base_url: https://vedicheritage.gov.in/
    strengths:
      - National institutional backing, with the Vedic corpus as its explicit and sole remit.
      - Covers all four Vedas with their shakhas and recensions, including Shukla and Krishna Yajurveda and both Shaunaka and Paippalada Atharvaveda, together with Brahmana, Aranyaka, Upanishad, and Vedanga material.
      - Carries audio and video recitation, including for Taittiriya and Shaunaka material. This is the only registered authority supplying recitation, and it matters for accentually and metrically sensitive Vedic text.
      - Organised by shakha rather than by a flattened notion of the Veda, which matches how data/corpus.yaml records these texts.
    suitable_roles:
      - primary-digital-witness
      - audio-witness
      - independent-verification
    licensing_status: restrictive-permission-required
    reliability_notes:
      - Institutional ownership is clear and stable, and the domain is a Government of India domain.
      - Edition provenance is NOT prominently disclosed in navigation. Where a passage depends on wording, the underlying edition must be established before this is used as a primary witness, and it may need to be paired with an edition anchor.
    coverage_notes:
      - Vedic layer only. It contributes nothing to the darshana, vyakarana, ayurveda, ganita, jyotisha, artha, aesthetics, dharmashastra, or itihasa parts of the corpus.
    access_notes:
      - Verified reachable on 2026-09-21.
      - COPYRIGHT - the stated policy is that contents may not be reproduced partially or fully without written permission from IGNCA or the contributor, and that material may be referenced in another publication if the source is appropriately acknowledged. Link and cite with acknowledgement; do not copy text into this repository. Audio must not be redistributed.

  - id: gretil
    name: GRETIL - Göttingen Register of Electronic Texts in Indian Languages
    institution: Niedersächsische Staats- und Universitätsbibliothek Göttingen
    parent_institution: Georg-August-Universität Göttingen
    country: Germany
    authority_type: university-hosted-text-corpus
    base_url: https://gretil.sub.uni-goettingen.de/
    strengths:
      - The broadest single body of machine-readable Sanskrit e-texts, covering most families in Corpus v1 - Vedic, epic, darshana, vyakarana, ayurveda, dharmashastra, and technical literature.
      - Individual entries credit the input contributor and frequently name the printed edition, sometimes in the filename itself; the Rigveda file is identified against the Aufrecht edition and credited to van Nooten and Holland.
      - Migrating to TEI-conformant XML, with plain-text and HTML forms also served; older non-Unicode encodings were retired in 2019.
      - Portions are deposited on Zenodo with persistent identifiers and Creative Commons Attribution terms, which gives a citable and archivable form.
    suitable_roles:
      - primary-digital-witness
      - machine-readable-witness
      - independent-verification
      - commentary-witness
    licensing_status: mixed-per-text
    reliability_notes:
      - GRETIL describes itself as a register that normalises contributions of varying source and quality rather than as a guarantor of textual fidelity. Quality therefore varies by contributor and must be assessed per text, not assumed from the authority.
      - It is a transcription repository, not an edition project. A GRETIL file is evidence of a transcription of an edition; the edition itself remains the anchor.
      - Because contributors overlap with other projects, GRETIL files must not be assumed independent of TITUS or of other e-text collections. See the verification rule above.
    coverage_notes:
      - Strong across most of the corpus. Weakest for regional-language material - it does hold some Malayalam and Tamil, but no verified witness for yuktibhasha was established during this review.
    access_notes:
      - Verified reachable on 2026-09-21; representative entries and file paths inspected.
      - Licensing varies by contributed text; the per-file statement governs and must be recorded on each source record rather than inherited from this authority entry.

  - id: titus
    name: TITUS - Thesaurus Indogermanischer Text- und Sprachmaterialien
    institution: Institut für Empirische Sprachwissenschaft, Goethe-Universität Frankfurt am Main
    parent_institution: Goethe-Universität Frankfurt am Main
    country: Germany
    authority_type: university-hosted-text-corpus
    base_url: https://titus.uni-frankfurt.de/
    strengths:
      - Long-established Indo-European text database with substantial Vedic holdings, maintained in an academic comparative-linguistics setting where accentuation and morphology are treated as primary data.
      - Run as a joint project with Charles University Prague, the University of Copenhagen, and the Universidad de Oviedo, which gives it institutional breadth beyond a single custodian.
      - Useful as a cross-check on Vedic wording where its transcription lineage is genuinely distinct from the witness being checked.
    suitable_roles:
      - independent-verification
      - primary-digital-witness
      - machine-readable-witness
    licensing_status: unclear-attribution-only
    reliability_notes:
      - Scholarly provenance is good, but the site states no explicit terms of use, licensing, or edition methodology; copyright is attributed to named individuals.
      - Interface and addressing conventions are dated and less predictable than SARIT or GRETIL, which makes long-term deep-link citation less safe. Cite by text and reference, and record the URL as accessed.
      - SHARED LINEAGE RISK - TITUS and GRETIL share contributors and underlying Vedic e-text data. Do not pair them as two independent witnesses without checking transcription origin.
    coverage_notes:
      - Vedic and comparative Indo-European material is the strength. Contributes little to the ayurveda, ganita, jyotisha, artha, or aesthetics families.
    access_notes:
      - Verified reachable on 2026-09-21.
      - Absence of an explicit licence means reuse beyond short attributed quotation should not be assumed.

  - id: sarit
    name: SARIT - Search and Retrieval of Indic Texts
    institution: SARIT project
    parent_institution: Heidelberg Research Architecture, Cluster of Excellence Asia and Europe in a Global Context, University of Heidelberg
    country: Germany
    authority_type: scholarly-tei-corpus
    base_url: https://sarit.indology.info/
    strengths:
      - Texts encoded to TEI P5 with explicit scholarly encoding guidelines, including the ability to record which page of a printed edition a passage falls on. This is the strongest edition-aware encoding among the registered authorities.
      - Master copies are version-controlled on GitHub at github.com/sarit/SARIT-corpus, so the full edit history of a text is inspectable - a form of provenance no other registered authority offers.
      - Corpus texts are distributed under liberal Creative Commons terms, making SARIT the most reuse-friendly of the text repositories.
      - Holdings are strong exactly where Corpus v1 is dense in argument - darshana, ayurveda including the Ashtanga Hridaya, Arthashastra, and epic material.
      - Founded and supported by recognised specialists with NEH/DFG bilateral digital humanities funding and British Association for South Asian Studies support.
    suitable_roles:
      - primary-digital-witness
      - machine-readable-witness
      - edition-anchor
      - independent-verification
      - commentary-witness
    licensing_status: creative-commons-liberal
    reliability_notes:
      - Encoding quality and scholarly oversight are the highest of the registered text corpora.
      - STABILITY CAVEAT - during verification on 2026-09-21 the web application returned HTTP 502 on several paths including the landing page and documentation, while individual text URLs were indexed and reachable. The GitHub repository is the durable form and should be treated as the citable master; the web application should not be relied on as the sole access route.
      - Edition disclosure is supported by the encoding but is not uniform across all texts; confirm per text rather than assuming the TEI header is complete.
    coverage_notes:
      - Excellent for darshana, ayurveda, and artha-statecraft. Thinner for the Vedic layer, where the Vedic Heritage Portal, GRETIL, and TITUS are better placed.
    access_notes:
      - Web application partially unavailable at time of verification; GitHub master copies verified reachable.
      - Record the GitHub commit or release alongside the URL when citing, so the exact state of the text is recoverable.

  - id: gita-supersite
    name: Gita Supersite
    institution: Indian Institute of Technology Kanpur
    parent_institution: Indian Institute of Technology Kanpur
    country: India
    authority_type: university-hosted-text-portal
    base_url: https://www.gitasupersite.in/
    strengths:
      - Presents original Sanskrit alongside classical commentaries and translations in eleven Indian languages, with verse-level addressing suited to passage work.
      - Covers texts that sit at the centre of Corpus v1 - Bhagavad Gita, Upanishads, Valmiki Ramayana, Brahma Sutra, and Yoga Sutra.
      - COMMENTARY COVERAGE is its distinctive value. It carries Shankara Bhashya material for the Brahma Sutra and Vyasa Bhashya for the Yoga Sutra, which correspond directly to approved commentary records that no other registered authority serves as well.
    suitable_roles:
      - primary-digital-witness
      - commentary-witness
      - translation-reference
      - independent-verification
    licensing_status: unclear-no-statement
    reliability_notes:
      - Institutional backing is solid, but no copyright or terms-of-use statement was found during inspection, so reuse rights are unestablished and only short attributed quotation should be assumed.
      - Edition provenance for the commentaries was not disclosed on inspection. Since commentarial wording is precisely what a COMMENTARIAL claim depends on, the edition behind each commentary must be established before it is used as a commentary witness.
      - Its parallel display of many translations is convenient but invites silent conflation of recensions; the Gita and Upanishad recension warnings in data/corpus.yaml still apply.
    coverage_notes:
      - Serves itihasa, upanishad, darshana, and commentary families. Nothing for Vedic Samhita, ayurveda, ganita, jyotisha, or aesthetics.
    access_notes:
      - DOMAIN MIGRATION VERIFIED - the address gitasupersite.iitk.ac.in issues an HTTP 301 permanent redirect to gitasupersite.in, confirmed on 2026-09-21. The new domain is recorded as base_url. Any stored citation using the old host should be rewritten, and the redirect must not be assumed permanent.

  - id: niimh-esamhita
    name: NIIMH e-Samhita and e-Nighantu
    institution: National Institute of Indian Medical Heritage (NIIMH)
    parent_institution: Central Council for Research in Ayurvedic Sciences (CCRAS), Ministry of Ayush, Government of India
    country: India
    authority_type: national-institutional-repository
    base_url: https://niimh.nic.in/
    strengths:
      - The national institutional repository for classical Ayurvedic texts, covering the Charaka Samhita and Sushruta Samhita, both approved Corpus v1 texts, together with Madhavanidana and nighantu lexical works.
      - Searchable e-book presentation in Devanagari plus several Indian scripts and a diacritical form, with chapter and verse addressing.
      - Government custodianship under the ministry responsible for the discipline gives it standing no third-party Ayurveda site has.
    suitable_roles:
      - primary-digital-witness
      - commentary-witness
      - independent-verification
    licensing_status: unverified
    reliability_notes:
      - NOT INSPECTED - see access_notes. This authority is registered on institutional grounds and on corroborating scholarly description, NOT on direct examination of its texts. Its reliability, edition disclosure, and licensing are therefore unestablished.
      - Before any source record is created against this authority, the portal must be inspected directly and this entry updated. Treat it as provisional.
    coverage_notes:
      - Ayurveda family only, where it is the single most important prospective authority.
    access_notes:
      - UNREACHABLE AT VERIFICATION - on 2026-09-21 both niimh.nic.in and the alternative host niimh.res.in refused connection from the verifying network. The service is documented as live and is likely restricted to Indian networks or intermittently available rather than discontinued.
      - A second Government of India portal, esamhita.ayush.gov.in, returned HTTP 403 on the same date and may be a successor or parallel service; it must be investigated when access is possible.
      - Verification from an Indian network is required before this authority is relied on.

  - id: dcs
    name: Digital Corpus of Sanskrit (DCS)
    institution: Digital Corpus of Sanskrit, created and maintained by Oliver Hellwig
    parent_institution: null
    country: Germany
    authority_type: annotated-linguistic-corpus
    base_url: http://www.sanskrit-linguistics.org/dcs/
    strengths:
      - Manually validated lexical and morphosyntactic annotation over Vedic and classical texts - the only registered authority offering lemmatised, analysed text rather than plain transcription.
      - Licensed CC BY 4.0 and available as downloadable data, making it the most reusable machine-readable resource registered here.
      - Enables corpus-level work the project will need - locating a term across texts, tracing a technical vocabulary, checking whether a word occurs where a claim says it does.
    suitable_roles:
      - machine-readable-witness
      - scholarly-secondary-reference
    licensing_status: cc-by-4.0
    reliability_notes:
      - NOT AN EDITION AUTHORITY. Its texts are drawn from existing e-texts and prepared for linguistic annotation. It must never be used as an edition anchor, and should not be a primary witness for wording where a claim turns on the reading.
      - Annotation is a scholarly interpretation of the text, not part of it. A morphological analysis is evidence of the annotator's parse and must not be reported as what the text states.
      - SHARED LINEAGE RISK - its underlying e-texts overlap with GRETIL and other collections, so it rarely provides genuine independent verification.
    coverage_notes:
      - Broad across Vedic and classical Sanskrit. Nothing for Malayalam or other regional-language works.
    access_notes:
      - The canonical host presented a TLS certificate mismatch on https during verification on 2026-09-21; the http form is the documented address. Record this when citing, and prefer the downloadable dataset over live links for durability.

  - id: bori
    name: Bhandarkar Oriental Research Institute
    institution: Bhandarkar Oriental Research Institute, Pune
    parent_institution: null
    country: India
    authority_type: critical-edition-institute
    base_url: https://bori.ac.in/
    strengths:
      - Producer of the critical edition of the Mahabharata, prepared from roughly 1,259 manuscripts over some five decades under Sukthankar, Belvalkar, De, and Dandekar. This is the edition anchor the mahabharata record in data/corpus.yaml requires by name.
      - Holds the manuscript archive behind that edition, making it a manuscript-reference authority as well as an edition authority.
      - Its constituted text has been issued on CD-ROM with search, and volumes are scanned on Internet Archive, so the edition is consultable even though it is not published as an open web corpus.
      - THE MACHINE-READABLE CRITICAL EDITION EXISTS AND BORI STANDS BEHIND IT. From 1997 to 2001 John D. Smith ran a project in association with BORI, funded by the British Academy and the Society for South Asian Studies, which corrected the entire electronic Mahabharata by hand. The resulting text is served with BORI's agreement and the electronic text copyright is held by BORI. It is registered at sr-mbh-indology-ce under the indology-bombay authority.
      - BORI ALSO ANCHORS THE BHAGAVAD GITA. S. K. Belvalkar's critically edited Bhagavadgita, Poona 1945, is a reprint of the relevant parts of the Bhismaparvan from this critical edition, so the Gita's critical text and its host text are the same object.
      - The constituted text is reported at some 73,791 verses across about 1,995 chapters, from roughly 1,259 collated manuscripts. Those are facts about the edition, not claims about the epic's history.
    suitable_roles:
      - edition-anchor
      - manuscript-reference
      - scholarly-secondary-reference
    licensing_status: publisher-restricted
    reliability_notes:
      - The highest-authority edition anchor available for the Mahabharata; no digital transcription substitutes for it when critical-edition numbering is at issue.
      - It anchors the Mahabharata only. It is NOT the authority for the Ramayana critical edition, which was produced elsewhere and for which no authority is yet registered.
      - The institute publishes and sells its editions; the apparatus and constituted text are modern scholarly work under copyright even though the underlying epic is not.
    coverage_notes:
      - itihasa, specifically mahabharata and by extension bhagavad-gita numbering. Also relevant to manuscript questions across families through its catalogues.
    access_notes:
      - Institutional site verified on 2026-09-21. The edition itself is print and CD-ROM rather than an open online corpus; scans of individual volumes are separately available via the Internet Archive authority below.

  - id: insa
    name: Indian National Science Academy - history of science publications
    institution: Indian National Science Academy (INSA)
    parent_institution: null
    country: India
    authority_type: learned-academy-publisher
    base_url: https://insaindia.res.in/
    strengths:
      - Publisher of the Indian Journal of History of Science, running since 1966, the principal venue for scholarship on Indian mathematics and astronomy.
      - Publisher of critical editions and annotated translations of texts approved in Corpus v1, including K. V. Sarma's edition of the Aryabhatiya with Suryadeva Yajvan's commentary, and editions and translations of the Brahmasphutasiddhanta including Ikeyama's edition with Prthudaka's commentary.
      - Directly supplies what CLAIM_POLICY.md demands for this material - modern history-of-science sourcing, separate from the ancient text, for any claim about priority, correspondence, or transmission.
    suitable_roles:
      - scholarly-secondary-reference
      - edition-anchor
      - translation-reference
      - commentary-witness
    licensing_status: mixed-open-and-publisher-restricted
    reliability_notes:
      - A national learned academy; the strongest registered authority for the jyotisha and ganita families, where popular writing most often overstates priority claims.
      - Its editions are the anchor for aryabhatiya and brahmasphutasiddhanta; its journal is the secondary layer. The two roles are distinct and should not be merged on one source record.
      - The journal has been co-published with a commercial publisher since 2021, so recent issues may not be open even where older ones are.
    coverage_notes:
      - jyotisha, ganita, and history of Indian science generally, including Kerala-school scholarship. Also useful secondary material for ayurveda history.
    access_notes:
      - DOMAIN NOTE - insaindia.res.in is the current institutional site; insa.nic.in also resolves and carries journal pages. Record which host a given resource was retrieved from.
      - Older digitised volumes and monograph lists are available from the academy; access terms vary by item and must be checked per record.

  - id: internet-archive
    name: Internet Archive - scanned scholarly editions
    institution: Internet Archive
    parent_institution: null
    country: United States
    authority_type: scan-repository
    base_url: https://archive.org/
    strengths:
      - Holds scans of printed critical and scholarly editions that exist nowhere else online, including volumes of the BORI Mahabharata critical edition, and large runs of the Indian Journal of History of Science.
      - Incorporates the Digital Library of India and Public Library of India collections, which digitised a great deal of Indian institutional library holdings.
      - Lets an edition anchor actually be consulted rather than merely cited, which is what SOURCE_POLICY.md's edition-awareness requirement needs in practice.
      - Stable item identifiers and durable URLs make long-term citation safe.
    suitable_roles:
      - edition-anchor
      - scholarly-secondary-reference
      - independent-verification
    licensing_status: per-item-often-unclear
    reliability_notes:
      - A repository of scans, NOT an editorial authority. The authority of any item is the authority of the edition scanned, and that edition must be identified from the scan itself - title page, editor, publisher, year - not from the uploader's metadata.
      - Scan and OCR quality vary; OCR text must never be treated as a transcription witness. Read the page image.
      - Item metadata is frequently incomplete or wrong. A BORI Mahabharata volume inspected on 2026-09-21 carried a rights field of "not available" and an uploader-supplied description, with the scanning institution and year recorded but no rights determination.
    coverage_notes:
      - Potentially serves every family, since it is the fallback route to printed editions across the corpus. Especially important for aesthetics, dharmashastra, and Kerala-school material where no specialist authority is registered.
    access_notes:
      - LICENSING RISK - public-domain status must be assessed per item, by the edition's own publication date and editorial copyright, not assumed from availability. A modern critical edition's constituted text and apparatus may remain in copyright although the ancient work is not. Some items are lending-restricted.

  - id: cologne-sanskrit-lexicon
    name: Cologne Digital Sanskrit Dictionaries
    institution: Institute of Indology and Tamil Studies, University of Cologne
    parent_institution: Universität zu Köln
    country: Germany
    authority_type: reference-lexicon-repository
    base_url: https://www.sanskrit-lexicon.uni-koeln.de/
    strengths:
      - Forty-three dictionaries across Sanskrit-English, Sanskrit-German, Sanskrit-French, Sanskrit-Latin and Sanskrit-Sanskrit, spanning 1832 to 1993, with both PDF page scans and structured XML.
      - Directly serves the EDITORIAL_STANDARD.md requirement to retain and explain technical terms, and the CLAIM_POLICY.md requirement to identify plausible meanings of a term rather than assert one English equivalent.
      - Downloadable structured data supports consistent internal glossing across entries.
      - Long institutional maintenance since 1994, with part of the digitisation funded by a DFG-NEH project.
    suitable_roles:
      - scholarly-secondary-reference
    licensing_status: unclear-no-explicit-licence
    reliability_notes:
      - A lexical reference authority only. It supplies no primary text and must never appear as a witness to a passage.
      - The dictionaries are historical works. Monier-Williams and its contemporaries carry the assumptions of their period, and a gloss taken from them is evidence of nineteenth-century lexicography, not a neutral definition. Terms central to a claim must also be checked against current specialist scholarship.
      - No explicit licence is stated for the dictionary data; reuse beyond quotation should be confirmed with the maintainers.
    coverage_notes:
      - Terminology across the whole corpus. Weakest for discipline-specific technical vocabulary in ganita, jyotisha, and ayurveda, where specialist glossaries are better.
    access_notes:
      - Verified reachable on 2026-09-21; dictionary list and download formats inspected.

  - id: sanskrit-library
    name: The Sanskrit Library
    institution: The Sanskrit Library, a non-profit charitable organisation
    parent_institution: null
    country: United States
    authority_type: scholarly-etext-catalogue
    base_url: https://sanskritlibrary.org/
    strengths:
      - PROVENANCE DISCLOSURE IS ITS DECISIVE VALUE HERE. Its catalogue records for the Vedic e-texts it republishes from TITUS state the full chain - the printed edition, the transcriber, the dates and the intermediate TITUS publication - which TITUS's own pages do NOT state. Registering it converts several previously uncertain lineages into established ones.
      - It established, by inspection, that the TITUS Aitareya-Brahmana descends from F. J. Martinez Garcia's transcription of Theodor Aufrecht's 1879 edition, and that the TITUS Jaiminiya-Upanisad-Brahmana rests on Hanns Oertel's edition in JAOS 16 (1896), entered by Masato Fujii and proofread by Mieko Kajihara.
      - Texts are issued with structured XML markup under an explicit Creative Commons licence, edited by Peter M. Scharf, so the republished form is citable and reusable where the TITUS original is not.
    suitable_roles:
      - machine-readable-witness
      - scholarly-secondary-reference
    licensing_status: cc-by-nc-sa-3.0
    reliability_notes:
      - NOT AN INDEPENDENT WITNESS for the texts it takes from TITUS. Its own catalogue records say the Sanskrit Library version builds upon the TITUS edition rather than replacing it. Any text sourced here must carry derived_from_transcription pointing at the TITUS record and must never be paired with it as verification.
      - "Its value in this registry is documentary rather than textual: it is the best available answer to \"which printed edition is this e-text actually based on\"."
      - Registered after inspection of two representative catalogue records. Coverage beyond the Vedic TITUS republications was not assessed, and an earlier review found its own homepage disclosed neither provenance nor licensing, so judge per catalogue record rather than per site.
    coverage_notes:
      - Vedic e-texts republished from TITUS, with catalogue metadata. Established relevance so far is to aitareya-brahmana and jaiminiya-upanishad-brahmana.
    access_notes:
      - Catalogue records verified reachable on 2026-09-21 and inspected directly.
      - Licence stated as Creative Commons Attribution NonCommercial ShareAlike 3.0, with rights not granted reserved. Non-commercial, as with the GRETIL TEI files.

  - id: indian-culture-portal
    name: Indian Culture Portal
    institution: Indian Culture Portal, executed by the Indian Institute of Technology Bombay
    parent_institution: Ministry of Culture, Government of India
    country: India
    authority_type: national-digital-heritage-aggregator
    base_url: https://www.indianculture.gov.in/
    strengths:
      - A single government platform aggregating digitised holdings from museums, libraries, archives and cultural institutions across India, including scanned e-books, manuscripts and archival material.
      - Supplies a SECOND GOVERNMENT-HOSTED ROUTE to editions otherwise reachable only through the Internet Archive. It carries the Raghu Vira Kapisthala-Katha Samhita, which is the sole edition anchor for kapisthala-katha-samhita, so this authority gives that uniquely dependent text redundancy against a single point of failure.
      - Carries manuscript metadata alongside scans, which supports work on texts where the manuscript question is live.
      - Version 2.0 was launched with a rebuilt architecture, indicating continued institutional investment rather than an abandoned portal.
    suitable_roles:
      - edition-anchor
      - manuscript-reference
      - scholarly-secondary-reference
    licensing_status: unverified
    reliability_notes:
      - AN AGGREGATOR, NOT AN EDITORIAL BODY. The authority of any item is the authority of the edition scanned and of the contributing institution, not of the portal. Item-level metadata must be read from the scanned title page, exactly as for the Internet Archive.
      - Registered on institutional grounds and on corroborating published description. Its item-level metadata quality, rights statements and URL stability have NOT been assessed.
    coverage_notes:
      - Broad Indian cultural heritage. For Corpus v1 its established relevance is as a scan route for printed Vedic editions, especially Kapisthala-Katha.
    access_notes:
      - NOT INSPECTED - connection was refused from the verifying network on 2026-09-21, the same pattern as niimh-esamhita. The portal is documented as live and recently upgraded, so this is most likely a restriction to Indian networks rather than an outage.
      - Verification from an Indian network is required before any source record is created against this authority.

  - id: asiatic-society-kolkata
    name: The Asiatic Society, Kolkata
    institution: The Asiatic Society
    parent_institution: Ministry of Culture, Government of India
    country: India
    authority_type: learned-society-publisher
    base_url: https://asiaticsociety.culture.gov.in/
    strengths:
      - THE PUBLICATION AUTHORITY FOR THE PAIPPALADA CRITICAL EDITION. Dipak Bhattacharya's critical edition of the Paippalada Samhita, the anchor for atharvaveda-samhita-paippalada, was issued by this Society across volumes from 1997 to 2016. This is the single most important gap it fills.
      - Founded in 1784 and an Institution of National Importance declared by an Act of Parliament, which gives it standing and a durable publication record.
      - Publisher of the Bibliotheca Indica series, launched in 1849 and still running - a long-standing series of edited oriental texts and translations that anchors editions well beyond the Atharvaveda.
      - Holds rare manuscripts, books and lithographs, making it a manuscript-reference authority as well as a publisher.
    suitable_roles:
      - edition-anchor
      - manuscript-reference
      - scholarly-secondary-reference
    licensing_status: publisher-restricted
    reliability_notes:
      - INSTITUTIONAL CONTINUITY - the Bibliotheca Indica series passed from the Asiatic Society of Bengal to the Royal Asiatic Society of Bengal and then to The Asiatic Society. A citation should use the name the Society bore at the date of the volume cited, and must not retrofit the current name onto a nineteenth-century imprint.
      - A publisher and custodian, not a digital text corpus. It supplies printed anchors; it does not supply machine-readable text and must never be recorded as a digital witness.
    coverage_notes:
      - Paippalada Atharvaveda first; Bibliotheca Indica volumes are potentially relevant across several corpus families once mapping extends beyond the Samhitas.
    access_notes:
      - Official site verified reachable on 2026-09-21; legal status and ministry confirmed from it.
      - Multiple official hosts exist - asiaticsociety.culture.gov.in, asiaticsocietykolkata.org and asiaticsocietykolkata.nic.in. The .culture.gov.in host is recorded as base_url; record which host any future resource was retrieved from.
      - The site asserts all rights reserved. Modern editions including the Paippalada volumes are in copyright; the constituted text and apparatus are not reusable.

  - id: national-sanskrit-university
    name: National Sanskrit University, Tirupati
    institution: National Sanskrit University
    parent_institution: Ministry of Education, Government of India
    country: India
    authority_type: central-university-research-publisher
    base_url: https://nsktu.ac.in/
    strengths:
      - A central university wholly devoted to Sanskrit, with a Department of Research and Publications, substantial manuscript holdings, and Vedic recording projects.
      - Relevant to Vedic editorial scholarship generally and to the Shukla Yajurveda tradition in particular, since B. R. Sharma's editorial work on the Kanva recension was developed during his years at this institution.
    suitable_roles:
      - edition-anchor
      - scholarly-secondary-reference
      - manuscript-reference
    licensing_status: publisher-restricted
    reliability_notes:
      - NAME CHANGE, RECORDED PRECISELY - founded in 1961 as Rashtriya Sanskrit Vidyapeetha, Tirupati; declared a Deemed to be University in 1987; converted to a central university and renamed National Sanskrit University by the Central Sanskrit Universities Act, 2020 (No. 5 of 2020), assented 25 March 2020. Cite the name the institution bore at the date of the work cited.
      - DO NOT CONFUSE WITH Rashtriya Sanskrit Sansthan, New Delhi, a separate body also renamed under the same 2020 Act, as Central Sanskrit University. The two are distinct institutions with similar former names.
      - IMPORTANT NEGATIVE FINDING - this institution is NOT the publisher of B. R. Sharma's critical edition of the Kanva Samhita. Research on 2026-09-21 identified the publisher as Vaidika Samshodhana Mandala, Pune, with volumes issued in 1988, 1992 and 1999, financially supported by Rashtriya Sanskrit Sansthan, New Delhi. The record sr-vs-kanva-sharma-anchor must NOT be attributed to this authority.
    coverage_notes:
      - Vedic scholarship, manuscripts, and recordings. No specific Corpus v1 edition anchor has yet been tied to it.
    access_notes:
      - Institutional site verified reachable on 2026-09-21; current name, legal basis, location and research wing confirmed from it.
      - No publication catalogue was inspected, so its holdings relevant to Corpus v1 remain unestablished.

  - id: vvri-hoshiarpur
    name: Vishveshvaranand Vedic Research Institute (VVRI), Hoshiarpur
    institution: Vishveshvaranand Vedic Research Institute
    parent_institution: D.A.V. Organisation since 1982; integrated with Panjab University from 1 July 1965
    country: India
    authority_type: vedic-research-institute-publisher
    base_url: https://www.vvrinstitute.com/
    strengths:
      - THE ALTERNATIVE ATHARVAVEDA NUMBERING AUTHORITY. The Vishva Bandhu edition of the Atharvaveda, Hoshiarpur 1960-1964, numbers books 11-20 differently from the Roth and Whitney edition. The registered digital witness for atharvaveda-samhita-shaunaka carries explicit cross-references to that numbering, and the corpus record now flags the divergence as a citation_scheme_alt. This institute is the authority behind that second numbering system.
      - Founded by Acharya Vishva Bandhu and the home of the Vaidika-Padanukrama-Kosa, the Vedic Word Concordance - a reference tool of direct use for locating mantras and testing claims about where a term occurs.
      - Publisher of the Vishveshvaranand Indological Series.
    suitable_roles:
      - edition-anchor
      - scholarly-secondary-reference
    licensing_status: publisher-restricted
    reliability_notes:
      - "INSTITUTIONAL LINEAGE, RECORDED CAREFULLY. The original Vishveshvaranand Vedic Research Institute moved to Sadhu Ashram, Hoshiarpur after Partition. From 1 July 1965 it integrated with Panjab University, and the integration SPLIT the body: the Sanskrit teaching and dictionary sections became the Vishveshvaranand Vishva Bandhu Institute of Sanskrit and Indological Studies (VVBIS&IS) under Panjab University, while the residual V.V.R. Institute retained Hindi teaching, the research journals and the press. The V.V.R. Institute became part of the D.A.V. Organisation in 1982 while retaining independent administrative, financial and academic status."
      - CONSEQUENCE FOR CITATION - the Atharvaveda edition of 1960-1964 predates the split, so it was issued by the undivided Vishveshvaranand Vedic Research Institute. It must be cited to that body, not to VVBIS&IS or to Panjab University. Later lexicographical work may belong to VVBIS&IS instead; establish which body issued a given volume from the volume itself.
      - VVBIS&IS under Panjab University is a related but DISTINCT body and is not registered here; if a source record needs it, register it separately rather than treating the two as interchangeable.
    coverage_notes:
      - Atharvaveda Shaunaka numbering and text; Vedic concordance and lexicography across the Vedic corpus.
    access_notes:
      - The V.V.R. Institute site was inspected on 2026-09-21 and confirms the 1965 Panjab University integration and the 1982 D.A.V. association, which is the basis for the lineage recorded above.
      - LIMITATION - the site gives general institutional description only and does NOT list specific Vedic publications. The Atharvaveda edition and the Vedic Word Concordance were established from scholarly description, not from the institute's own site, and their current availability was not determined.
      - Twentieth-century editions are in copyright; no scan was located during this round.

  - id: indology-bombay
    name: INDOLOGY - electronic epic texts (bombay.indology.info)
    institution: The INDOLOGY website, epic texts prepared by John D. Smith, University of Cambridge
    parent_institution: null
    country: United Kingdom
    authority_type: scholarly-etext-project
    base_url: https://bombay.indology.info/
    strengths:
      - THE HOME OF THE MACHINE-READABLE CRITICAL EDITIONS OF BOTH EPICS, and the reason this batch has strong witnesses at all. It serves the electronic Mahabharata following the BORI Critical Edition and the electronic Valmiki Ramayana following the Baroda Critical Edition.
      - THE MAHABHARATA TEXT WAS HAND-CORRECTED AGAINST THE PRINTED EDITION. Between 1997 and 2001 John Smith ran a project in association with the Bhandarkar Oriental Research Institute, funded by the British Academy and the Society for South Asian Studies, employing assistants to correct the entire electronic text by hand. Very few e-texts in this registry rest on a comparable effort.
      - Served in several encodings and by book, which makes citation and retrieval practical.
      - It is the upstream of the GRETIL epic files, so registering it lets those be recorded as derivative rather than as second witnesses.
    suitable_roles:
      - primary-digital-witness
      - machine-readable-witness
    licensing_status: bori-agreement-restricted
    reliability_notes:
      - THE TWO EPIC TEXTS ARE NOT OF EQUAL QUALITY, AND THE SITE SAYS SO. The Mahabharata was systematically checked; the Ramayana statement warns that its text has NOT been submitted to rigorous revision and scrutiny and still contains many errors. That difference must be carried into any use of the Ramayana file.
      - The texts represent constituted critical editions. A critical edition is an editorial reconstruction from manuscript comparison, not the original epic, and nothing served here may be described as such.
      - Both texts descend from Muneo Tokunaga's original data entry, revised by Smith; they are one lineage, not two.
    coverage_notes:
      - Mahabharata and Valmiki Ramayana. The Bhagavad Gita is reachable within the Mahabharata file as part of the Bhishmaparvan.
    access_notes:
      - Statements for both texts inspected on 2026-09-21.
      - THE MAHABHARATA ELECTRONIC TEXT IS MADE AVAILABLE WITH BORI'S AGREEMENT and the electronic text copyright is held by BORI. It is not open-licensed; treat as consult-and-cite, and do not redistribute the corpus.
      - No explicit licence statement was found for the Ramayana text.

  - id: oriental-institute-baroda
    name: Oriental Institute, Maharaja Sayajirao University of Baroda
    institution: Oriental Institute (Prachya Vidya Mandir)
    parent_institution: Maharaja Sayajirao University of Baroda
    country: India
    authority_type: critical-edition-institute
    base_url: https://msubaroda.ac.in/academics/OI
    strengths:
      - PRODUCER OF THE CRITICAL EDITION OF THE VALMIKI RAMAYANA, prepared between 1951 and 1975 and published in seven volumes, one per kanda, from manuscript evidence gathered across India. This fills a gap flagged earlier in this registry - BORI anchors the Mahabharata but had no counterpart for the Ramayana.
      - Publisher of Gaekwad's Oriental Series, begun in 1915, a long-running critical-editing programme. That series also published the Brihaspatismriti reconstruction already registered in this corpus, so this authority serves more than the epic.
      - Founded in 1893 and formally established in 1927; a constituent institute of the university since 1949, giving it durable institutional standing.
    suitable_roles:
      - edition-anchor
      - manuscript-reference
      - scholarly-secondary-reference
    licensing_status: publisher-restricted
    reliability_notes:
      - The authority of record for the Ramayana critical edition. Individual kanda volumes carry their own editors - Balakanda by G. H. Bhatt, Ayodhyakanda by P. L. Vaidya, Aranyakanda by P. C. Divanji among them - and a citation should name the volume editor where the reading matters.
      - A critical edition is an editorially constituted text. The Baroda text is the best-evidenced Ramayana available; it is not the original poem and must not be described as one.
      - An institute and publisher, not a digital text corpus. It supplies printed anchors, not machine-readable text.
    coverage_notes:
      - Valmiki Ramayana critical edition; Gaekwad's Oriental Series more broadly, which touches the dharmashastra family as well.
    access_notes:
      - Institutional page verified on 2026-09-21; founding history, university affiliation and the Ramayana edition dates confirmed from it and corroborating sources.
      - Volumes are print; scans of several kanda volumes are separately available via the Internet Archive and are registered as anchors there.

  - id: pandit
    name: PANDiT - Prosopographical Database of Indic Texts
    institution: PANDiT project
    parent_institution: null
    country: international
    authority_type: scholarly-metadata-database
    base_url: https://panditproject.org/
    strengths:
      - Structured, curated scholarly data on works, authors, places, institutions, and manuscripts of premodern South Asia, built for exactly the question this registry keeps hitting - which work is which, and who commented on whom.
      - Designed around commentarial networks, which maps onto the heavily commentary-structured parts of Corpus v1 - the Brahma Sutra bhashyas, the Paninian chain, the Nyaya and Mimamsa layers.
      - Directly useful for the name-collision problems already recorded in data/corpus.yaml, such as the several works attributed to a Katyayana and the two Patanjalis, where it supplies scholarly identifications rather than assumptions.
      - Has been digitising descriptive manuscript catalogues, including BORI's Vedanta catalogues, linking text identity to manuscript evidence.
    suitable_roles:
      - scholarly-secondary-reference
      - manuscript-reference
    licensing_status: unverified
    reliability_notes:
      - A METADATA authority, not a text repository. It supplies no primary text and must never be cited as a witness to wording.
      - Contributor-curated. Entries vary in completeness and should be treated as scholarly opinion to be checked, not as settled fact - particularly for attribution and dating, which CLAIM_POLICY.md treats as HISTORICAL claims requiring their own sourcing.
    coverage_notes:
      - Strongest for darshana, vyakarana, and commentarial literature. Useful across the corpus for disambiguating works and authors before a source record is created.
    access_notes:
      - Verified reachable on 2026-09-21. Licensing terms for data reuse were not established and must be checked before any bulk use.

# Source records for the 12 approved Veda Samhita texts only. All other
# approved texts remain source_status: pending and are unmapped.
#
# WHAT THIS ROUND ESTABLISHED
#
# The most important result is negative. Several repositories that look like
# separate witnesses are not. Inspection of file headers showed that:
#   - GRETIL's Atharvaveda Shaunaka file is a TITUS redaction by Gippert of the
#     Petr and Vavrousek input, so GRETIL and TITUS are ONE witness, not two;
#   - GRETIL's Taittiriya, Maitrayani and Kathaka Samhitas are credited "input
#     by TITUS" and are likewise not independent of it;
#   - GRETIL's and TITUS's Samaveda both derive from Anshuman Pandey's
#     transcription;
#   - TITUS's metrically restored Rigveda derives from the van Nooten and
#     Holland data that also stands behind the GRETIL Rigveda.
# Pairing any of these as two witnesses would have broken the multiple-witness
# rule in SOURCE_POLICY.md while appearing to satisfy it.
#
# An `authority_id: null` record is a purely bibliographic edition anchor: a
# printed edition identified and cited, with no registered digital authority
# serving it.
source_records:

  # === 1. RIGVEDA SAMHITA - SHAKALA =============================

  - id: sr-rigveda-shakala-gretil
    authority_id: gretil
    text_id: rigveda-samhita-shakala
    source_role: [primary-digital-witness, machine-readable-witness]
    title: Rgveda-Samhita (GRETIL TEI edition)
    url: https://gretil.sub.uni-goettingen.de/gretil/corpustei/sa_Rgveda-edAufrecht.xml
    edition_basis: Die Hymnen des Rigveda, Mandala I-VI and VII-X, ed. Theodor Aufrecht, 2nd ed., Bonn 1877
    editor: Theodor Aufrecht
    publisher: Marcus, Bonn
    publication_year: 1877
    digital_transcription_by: Barend A. van Nooten and Gary B. Holland; converted and revised by Detlef Eichler; normalised by Reinhold Grünendahl; TEI conversion by Maximilian Mehner
    language: sanskrit
    script: iast-transliteration
    recension: shakala
    coverage: complete-samhitapatha
    citation_scheme: [mandala, sukta, mantra]
    provides_original_text: true
    provides_translation: false
    provides_commentary: false
    provides_audio: false
    machine_readable: true
    licence: CC BY-NC-SA 4.0
    reuse_status: attribution-noncommercial-sharealike
    accessed_on: 2026-09-21
    quality_notes:
      - TEI header inspected directly. The edition basis is named explicitly in the header and in the filename, which is the clearest edition disclosure found anywhere in this round.
      - ACCENTS ARE PRESERVED and the text is Samhitapatha. This matters - the corpus record for this text requires that accent never be silently dropped, and this witness satisfies that requirement where the Atharvaveda file does not.
    limitations:
      - Aufrecht's is a nineteenth-century scholarly edition, not a modern critical edition; it is the standard reference text but carries its period's editorial assumptions.
      - The header carries only a good-faith copyright statement, so reuse rests on the stated CC licence rather than on a rights audit.
    derived_from_transcription: null
    independence_status: independent
    independence_type: edition-independent

  - id: sr-rigveda-shakala-titus
    authority_id: titus
    text_id: rigveda-samhita-shakala
    source_role: [independent-verification, machine-readable-witness]
    title: Rigveda - Samhitapatha, Padapatha and metrically restored text (TITUS)
    url: https://titus.uni-frankfurt.de/texte/etcs/ind/aind/ved/rv/mt/rv.htm
    edition_basis: null
    editor: H. S. Ananthanarayana, S. D. Atkins, G. E. Dunkel, J. Gippert, F. J. Martínez García (Samhitapatha); A. Lubotsky, Leiden (Padapatha)
    publisher: TITUS, Goethe-Universität Frankfurt
    publication_year: null
    digital_transcription_by: TITUS project team as above
    language: sanskrit
    script: iast-transliteration
    recension: shakala
    coverage: samhitapatha-and-padapatha
    citation_scheme: [mandala, sukta, mantra]
    provides_original_text: true
    provides_translation: false
    provides_commentary: false
    provides_audio: false
    machine_readable: true
    licence: null
    reuse_status: unclear-quotation-only
    accessed_on: 2026-09-21
    quality_notes:
      - Carries THREE distinct representations - Samhitapatha, Padapatha, and a metrically restored text - which is what makes it useful here.
      - The PADAPATHA, prepared by Lubotsky at Leiden, is the component that gives genuine verification value. It is a separate analytical text form resting on its own preparation, so agreement between it and the GRETIL Samhitapatha is meaningful evidence.
    limitations:
      - THE METRICALLY RESTORED VERSION IS NOT INDEPENDENT. It is stated to rest on the van Nooten and Holland Harvard Rigveda, the same data behind sr-rigveda-shakala-gretil. That component must never be cited as confirming the GRETIL text.
      - No edition basis is stated for the Samhitapatha component, so its lineage relative to Aufrecht is not established. Independence is claimed for the PADAPATHA COMPONENT ONLY.
      - No licence statement; treat as quotation-only.
    derived_from_transcription: van Nooten and Holland Harvard Rigveda (metrically restored component only)
    independence_status: independent
    independence_type: edition-independent
    independence_scope: >-
      Padapatha component only, prepared by Lubotsky at Leiden. The
      metrically restored component is derivative of the same data as
      sr-rigveda-shakala-gretil and carries no independence; the
      Samhitapatha component's lineage is unstated. A verification check
      against this record must use the Padapatha and must say so. Typed
      edition-independent ONLY because the Padapatha is an independently
      constituted text form, not a transcription of the Samhitapatha; no
      printed basis is stated for it, so this is the weakest
      edition-independent claim in the registry and may reasonably be
      downgraded to transcription-independent on review.

  - id: sr-rigveda-shakala-aufrecht-scan
    authority_id: internet-archive
    text_id: rigveda-samhita-shakala
    source_role: [edition-anchor]
