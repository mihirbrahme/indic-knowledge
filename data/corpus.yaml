  - id: kapisthala-katha-samhita
    title: Kapisthala-Katha Samhita
    title_devanagari: कपिष्ठलकठसंहिता
    family: veda-samhita
    textual_status: fragmentary
    veda: yajurveda
    branch: krishna
    shakha: kapisthala-katha
    recension: null
    language: sanskrit
    citation_scheme: null
    citation_scheme_review: true
    scope_notes:
      - INCOMPLETE TEXTUAL TRADITION - the extant transmission is fragmentary. This is not a complete Samhita that happens to be poorly edited; portions of the work are simply not extant.
      - Published and digital witnesses present the surviving material only. A printed edition or online text must never be read as evidence of a complete extant Samhita, and the absence of a passage in a witness is not evidence that the text never contained it.
      - No missing material may be supplied, reconstructed, restored, or inferred editorially, including by transfer from kathaka-samhita or any other related Samhita. Gaps are recorded as gaps.
      - Every passage drawn from this text must cite the specific surviving edition or witness actually consulted, and state that the citation rests on fragmentary transmission.
      - No citation scheme recorded because the surviving text and its modern edition must be examined before one can be stated.
      - Closely related to kathaka-samhita but must not be cited as a witness to it, nor it to this text.
      - SOURCE POSITION - better than expected for a fragmentary text. TITUS maintains a Kapisthala-Katha file separate from its Katha Samhita file, and Raghu Vira's 1932 edition is available as a scan, so a passage can be checked against the printed page. But the digital text is a sole witness with no independent check, and every citation must go back to the scan.
    priority: specialist
    status: approved
    sources:
      primary:
        - sr-kaps-titus
      edition_anchors:
        - sr-kaps-raghuvira-anchor
    source_status: partially-verified

  - id: samaveda-samhita-kauthuma
    title: Samaveda Samhita - Kauthuma recension
    title_devanagari: सामवेदसंहिता (कौथुम)
    family: veda-samhita
    veda: samaveda
    branch: null
    shakha: kauthuma
    recension: kauthuma
    language: sanskrit
    citation_scheme: [archika, prapathaka, dashati, mantra]
    citation_scheme_alt:
      - name: continuous-verse-numbering
        levels: [mantra]
        notes: >-
          Many editions and reference works cite by a single running verse
          number across the whole Samhita instead of by section. The mapping to
          the sectional scheme must be taken from the registered edition.
    citation_scheme_review: true
    scope_notes:
      - Divided into Purvarchika and Uttararchika; both sectional and continuous verse numbering are in use, and editions differ.
      - The associated Gana song-books are a separate performance layer and are not covered by this record.
      - Most of its verses also occur in the Rigveda; correspondence must be recorded rather than treated as identity of text.
      - SOURCE LIMITATION - the GRETIL and TITUS texts share one transcriber, Anshuman Pandey, so they are one witness and no independent digital verification exists. Neither names a printed edition, which is the weakest link in this text's chain; the Benfey anchor is bibliographically apt but has not been tied to the digital text.
    priority: medium
    status: approved
    sources:
      primary:
        - sr-sv-kauthuma-gretil
      edition_anchors:
        - sr-sv-kauthuma-benfey-anchor
    source_status: partially-verified

  - id: samaveda-samhita-jaiminiya
    title: Samaveda Samhita - Jaiminiya recension
    title_devanagari: सामवेदसंहिता (जैमिनीय)
    family: veda-samhita
    veda: samaveda
    branch: null
    shakha: jaiminiya
    recension: jaiminiya
    language: sanskrit
    citation_scheme: null
    citation_scheme_review: true
    scope_notes:
      - Transmitted by the Jaiminiya school with its own arrangement and its own song tradition.
      - Citation scheme left unrecorded pending examination of an approved edition; it must not be assumed to follow the Kauthuma division.
      - SOURCE GAP - nothing usable was located. Neither GRETIL nor TITUS carries a Jaiminiya Samaveda Samhita; both serve only the Kauthuma recension. The Vedic Heritage Portal page for this Samhita was inspected and is a navigation hub with no text, audio, or edition.
      - NO EDITION ANCHOR ESTABLISHED. The Raghu Vira and Lokesh Chandra edition that dominates search results is of the Jaiminiya BRAHMANA, a different work recorded separately at jaiminiya-brahmana. It must not be used as an anchor for this Samhita.
      - Passage work on this text is blocked. Resolving it will need specialist bibliography rather than repository search.
    priority: specialist
    status: approved
    source_status: source-gap

  - id: samaveda-samhita-ranayaniya
    title: Samaveda Samhita - Ranayaniya recension
    title_devanagari: सामवेदसंहिता (राणायनीय)
    family: veda-samhita
    veda: samaveda
    branch: null
    shakha: ranayaniya
    recension: ranayaniya
    language: sanskrit
    citation_scheme: null
    citation_scheme_review: true
    scope_notes:
      - Very close to the Kauthuma recension in mantra text, differing chiefly in the song tradition and in some divisions.
      - Because the recensions are close, a Kauthuma edition must not be used as a witness to Ranayaniya readings without explicit warrant.
      - Citation scheme left unrecorded pending examination of an approved edition. The Vedic Heritage Portal exposes an adhyaya / prapathaka / ardha / verse hierarchy for this recension, which is evidence for those levels but is not an edition and does not settle the scheme.
      - SOURCE GAP - the portal is the only resource addressing this recension, and inspection reached navigation levels only; no mantra text was seen and no edition is named. Neither GRETIL nor TITUS carries a Ranayaniya text. No edition anchor was established.
      - "Passage work is blocked, and the substitution risk here is the highest in the Samhita group: Kauthuma text is close enough to pass a careless check, and no Kauthuma source may be used for this record. The inspected portal page is recorded at sr-sv-ranayaniya-vedicheritage with an empty role, so the inspection is not repeated."
    priority: specialist
