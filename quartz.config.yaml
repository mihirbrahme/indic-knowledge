# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Indic Knowledge
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: mihirbrahme.github.io/indic-knowledge
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    # See docs/DESIGN_SYSTEM.md. One editorial serif carries display and prose;
    # Inter handles metadata. The `title` slot is used to load Noto Serif
    # Devanagari for original-language text -- custom.scss aliases it to
    # --ik-deva and restyles the site title itself with the serif.
    typography:
      header: Source Serif 4
      body: Source Serif 4
      interface: Inter
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#F7F3EA" # Warm Ivory - page ground
        lightgray: "#DED8CB" # hairlines
        gray: "#7B8598" # graph lines, tertiary UI
        darkgray: "#262626" # Charcoal - body prose
        dark: "#17263C" # Deep Ink Navy - headings, the question
        secondary: "#17263C" # links sit in ink, not a separate link colour
        tertiary: "#8A5130" # copper dark enough for text (5.75:1)
        highlight: rgba(217, 211, 199, 0.32)
        textHighlight: "#e0cfae88"
      darkMode:
        light: "#131A28"
        lightgray: "#26303F"
        gray: "#7A8798"
        darkgray: "#DDD8CC"
        dark: "#E8E3D8"
        secondary: "#E8E3D8"
        tertiary: "#D49468"
        highlight: rgba(42, 52, 68, 0.55)
        textHighlight: "#C9855A55"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  # Entries are 3-5 minute reads; a TOC adds chrome without helping.
  - source: "@quartz-community/table-of-contents"
    enabled: false
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  # Disabled. Project markdown is hard-wrapped at ~78 columns, so treating
  # every newline as a <br> breaks editorial prose mid-sentence instead of
  # letting it reflow to the reading measure.
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  # Only the editorial serif is fetched remotely. The metadata sans and the
  # Devanagari face use system stacks (see custom.scss): Quartz's font slots
  # are header/body/code/title only, and `title` is glyph-subset to the site
  # name, so neither could carry a fourth family. System Devanagari is also
  # the more robust choice -- the signature element needs no network.
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      useThemeFonts: true
      fontOrigin: googleFonts
      header: Source Serif 4
      body: Source Serif 4
      code: IBM Plex Mono
  # Disabled deliberately. This ships an Obsidian-style theme whose CSS
  # overrides configuration.theme.colors, the body font and the reading
  # width, so the approved design system cannot take effect while it runs.
  # Quartz's own theme.colors + @quartz-community/darkmode cover both modes.
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: default
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  # Disabled. It derives a CNAME file from baseUrl's host, which here would
  # emit `mihirbrahme.github.io` -- the apex of the user site, not this
  # project page at /indic-knowledge. Enable it only when a real custom
  # domain is configured.
  - source: "@quartz-community/cname"
    enabled: false
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  # A file explorer makes the site read as a vault. Reading pages use the
  # minimal top header instead. Re-enable for an internal browsing view.
  - source: "@quartz-community/explorer"
    enabled: false
    layout:
      position: left
      priority: 50
  # Graph capability is retained, not displayed. Per docs/WEB_EXPERIENCE.md
  # the global graph belongs under a future Explore -> Map, never on the
  # homepage or an article.
  - source: "@quartz-community/graph"
    enabled: false
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  # Superseded by the editorial `Continue exploring` block at the end of an
  # entry, which is curated rather than automatic.
  - source: "@quartz-community/backlinks"
    enabled: false
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  # Disabled. It emits the site title as an <h2>, which lands above the
  # page's own <h1> and breaks heading order. The wordmark is rendered as a
  # banner link by site-nav instead.
  - source: "@quartz-community/page-title"
    enabled: false
    layout:
      position: left
      priority: 10
  # Local component. Links are listed here so the site never ships a nav item
  # whose destination does not exist yet. Add Explore / Pathways when they do.
  - source: "./quartz-plugins/site-nav"
    enabled: true
    options:
      brand: Indic Knowledge
      links:
        Discover: "/"
        About: "/about"
    layout:
      position: left
      priority: 12
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  # Reading pages have no sidebars to hide, so the toggle has nothing to do.
  - source: "@quartz-community/reader-mode"
    enabled: false
    layout:
      position: left
      priority: 35
      group: toolbar
  # Reads as a file path. The header and Continue exploring carry wayfinding.
  - source: "@quartz-community/breadcrumbs"
    enabled: false
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      # Absolute URLs only. This component does not rewrite root-relative
      # hrefs, so "/about" would resolve above the /indic-knowledge base
      # path and 404. Internal wayfinding lives in the top nav.
      links:
        Source on GitHub: https://github.com/mihirbrahme/indic-knowledge
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  # KEEP ENABLED. This is the frontmatter transformer (order 5); disabling it
  # stops `draft: true` being parsed and silently publishes drafts. Its
  # properties *table* is what we do not want on an editorial page, so that is
  # switched off with hidePropertiesView instead.
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/obsidian-plugin-excalidraw"
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
