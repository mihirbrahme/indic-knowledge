      - LAYERED COMPOSITION - the received text is the product of at least three stages, an earlier teaching redacted by Charaka and later portions supplied by a subsequent redactor to complete sections held to be missing. Which stratum a passage belongs to is material to any historical claim and must be stated rather than assumed.
