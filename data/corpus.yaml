# CORPUS V1 IS FROZEN.
#
# 1. Corpus v1 may still receive metadata corrections. Fixing a citation
#    scheme, a scope note, a relationship, a language value, or a field that
#    was wrong or incomplete is expected and does not change the corpus
#    version.
#
# 2. Adding or removing an approved text is NOT a metadata correction. It
#    requires an explicit corpus-version decision by a human editor, and
#    approved_text_count above must be updated in the same change. The count is
#    an assertion about this file and must always match the number of records
#    in `texts`.
#
# 3. Candidates remain outside the approved corpus. Records in
#    data/corpus-candidates.yaml carry no approval, are not counted here, and
#    may not be referenced by any structured field in this file. Promoting a
#    candidate is a corpus-version decision under point 2.
#
# 4. Source verification is a SEPARATE process and is not affected by this
#    freeze. `source_status: pending` on every record remains correct and
#    expected. Freezing the corpus fixes WHICH texts are approved; it asserts
#    nothing about whether any text yet has registered witnesses. No passage
#    may be created from a text while its source_status is pending, frozen
#    corpus or not. Authorities are registered in data/sources.yaml.
#
# Corpus v1 - Vedic layer inventory and subsequent families.
#
# `status: approved` means the work is an approved project text under
# AGENTS.md. It does NOT mean any passage from it may yet be published:
# SOURCE_POLICY.md additionally requires registered source witnesses in
# data/sources.yaml and per-passage verification.
#
# `source_status: pending` records that no permitted source witness has been
# registered for this work yet. No canonical passage may be created from a
# text while its source_status is pending.
#
# Field semantics:
#   family      - must be an id in data/corpus-families.yaml
#   veda        - the Vedic collection the work belongs to
#   branch      - division within a Veda where one is recognised; used here
#                 only for the shukla / krishna division of the Yajurveda,
#                 otherwise null
#   shakha      - the Vedic school transmitting the work
#   recension   - populated only where this record is one of several named
#                 recensions of the same work; null where the work is not
#                 transmitted in competing named recensions, so that shakha
#                 and recension are not redundantly duplicated
#   citation_scheme        - ordered list of reference levels, outermost first
#   citation_scheme_alt    - other recognised schemes in active use for the same
#                 work, each with name / levels / notes. Recorded so that
#                 references can be MAPPED between schemes; an alternative
#                 scheme is never a substitute for the primary one. Absent
#                 where no alternative has been verified.
#   citation_scheme_review - true where the scheme is not settled enough to
#                 record without verification against an approved edition
#   language      - the work's primary language of composition. It is recorded
#                 per work and never assumed: most of the corpus is sanskrit,
#                 but the regional-language scientific and commentarial
#                 literature is not, and recording it as sanskrit for
#                 uniformity would be a false statement about the text.
#                 Values in use: sanskrit, malayalam.
#   embedded_in   - where the work is transmitted inside a larger work, with
#                 text_id / relationship / range / notes.
#                 text_id is null where the containing work is not itself an
#                 approved corpus text. range is null wherever the extent
#                 varies by recension or edition, or is not confidently
#                 established; the conventional identification is then stated
#                 in notes rather than asserted as the range.
#                 relationship uses: concluding-section, section-of,
#                 drawn-from.
#   related_to    - list of non-containment links to other corpus texts, each
#                 with text_id / relationship / notes. Used where two works are
#                 genuinely connected but neither contains the other.
#                 relationship uses: same-kalpa-corpus, closely-parallel-text,
#                 comments-on, commented-on-by, shares-attributed-author.
#                 text_id is null where the related work is not an approved
#                 corpus text.
#   vedanga_domain - for kalpa and vedanga-family works, the auxiliary
#                 discipline the work belongs to: shiksha, nirukta, chandas,
#                 jyotisha, kalpa, vyakarana. Recorded on the sutra families as well as
#                 the vedanga family, because data/corpus-families.yaml
#                 requires the kalpa overlap to be stated per work rather than
#                 resolved by silent reassignment.
#   textual_status - recorded only where the work does not survive as a
#                 continuously transmitted whole.
#                   fragmentary - the available text is assembled from
#                     citations in other works and is a modern reconstruction,
#                     not a surviving book.
#                   embedded-transmission - the work was not transmitted
#                     independently; it survives because a later work
#                     incorporates it, and any standalone printed text is an
#                     editorial extraction from that host.
#                   incompletely-preserved - the work was transmitted as a
#                     whole but the surviving witnesses are defective: portions
#                     are lost, or the text is corrupt to the point that
#                     passages cannot be established from it with confidence.
#   secondary_family - a second family the work also belongs to. Required by
#                 data/corpus-families.yaml, which states that the commentary
#                 family is cross-cutting and that a commentary belongs both to
#                 that family and to the family of the work it expounds, with
#                 both recorded.
#   darshana_school - the philosophical school a darshana-family work or its
#                 commentary belongs to: nyaya, vaisheshika, samkhya, yoga,
#                 mimamsa, vedanta.
#   commentarial_tradition - for a commentary, the interpretive tradition it
#                 founds or belongs to. Recording it is not ranking it: no
#                 tradition is the default reading of its root text.
#   discipline_focus - list, for works spanning more than one discipline, e.g.
#                 grammar and philosophy-of-language.
#
# Devanagari title forms are conventional bibliographic headings, not text
# established against a source witness; they are to be normalised when source
# witnesses are registered.
#
# Translations, source URLs, and commentary records are deliberately absent at
# this stage.

