  # ---------------------------------------------------------------
  # O. Darshana - the six classical systems
  #
  # Standing requirements for this group and its commentaries:
  #
  # The schools disagree substantively. Under CLAIM_POLICY.md they must not be
  # collapsed into a synthetic Indic position, and no school's reading may be
  # presented as the Indic view of self, knowledge, causation, language, or
  # liberation.
  #
  # Sutra texts in this group are terse to the point of being unreadable
  # without commentary. Where a meaning is supplied by a commentator, that is a
  # COMMENTARIAL claim, not a TEXTUAL one, and the two must stay distinguished
  # in any entry.
  #
  # Commentary records carry family: commentary with secondary_family:
  # darshana, as data/corpus-families.yaml requires both to be recorded.
  # ---------------------------------------------------------------

