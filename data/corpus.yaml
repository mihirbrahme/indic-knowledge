      - The Ashtadhyayi cannot be applied without its ancillary lists of verbal roots and word-classes, which are separate texts not yet in Corpus v1; any rule quoted in isolation from them is incomplete.
      - Those lists are now tracked as candidates dhatupatha and ganapatha in data/corpus-candidates.yaml. The references are prose only; no structured link from this approved record to an unapproved candidate exists. Neither list may be supplied from a modern grammatical database or digital tool in place of a registered witness.
      - Comparison with formal grammars, rewrite systems, or programming-language notation is a modern-connection claim requiring history-of-linguistics sourcing under CLAIM_POLICY.md. The system's formal character may be described; priority claims about modern computer science must not be asserted from it.
      - SOURCE POSITION - machine-readable sutra text in the standard adhyaya-pada-sutra numbering, which is stable across the tradition and makes this the most citable grammatical text in the corpus.
      - THE ANCILLARY LISTS ARE STILL ABSENT. Dhatupatha and Ganapatha remain corpus candidates and were not promoted; a rule quoted without them is incomplete.
