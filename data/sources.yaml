  # ===============================================================
  # DHARMA SUTRA AND DHARMASHASTRA RECORDS
  #
  # Standing findings:
  # 1. THE KYOTO GROUP UNDERLIES ALMOST ALL OF IT. Y. Ikari and colleagues
  #    prepared the TITUS Dharmasutras and checked or input several GRETIL
  #    Smriti files. This is a single scholarly effort, not many independent
  #    ones, and records here should not be read as mutually corroborating.
  # 2. EDITION BASES ARE UNUSUALLY WELL DISCLOSED in this group - every GRETIL
  #    dharma file inspected names its printed edition in the header. That is
  #    better than the Vedic groups and makes edition-aware citation possible.
  # 3. COVERAGE IS OFTEN PARTIAL. The Brihaspati file omits six kandas, the
  #    Parashara file omits the Vyavaharakanda, and both say so.
  #
  # CONTROVERSIAL PASSAGES. This group contains material frequently quoted
  # out of context in present-day polemics. The registry does not editorialise
  # and records no view on that material. The sourcing requirements for such
  # passages are stated in SOURCE_POLICY.md under "Controversial passages" and
  # apply during the editorial pass, not at registry level.
  # ===============================================================

  # === DHARMA SUTRAS ============================================

