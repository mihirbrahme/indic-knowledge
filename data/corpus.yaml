      - CLASSIFICATION DECISION - placed in dharmashastra, not dharma-sutra, despite the alternative title Vishnu Dharma Sutra and the sutra form of much of its prose.
      - Reason - current scholarship treats the surviving text as substantially later than the Dharma Sutra period, as a reworking that recasts earlier legal material in a devotional, Vaishnava frame, with verse sections framing the prose. Its sutra style is therefore a formal feature of a later composition rather than evidence of early date, and classifying it with the early Dharma Sutras would embed a dating claim in the taxonomy.
      - This placement is an editorial judgement about current classification and should be revisited if the registered scholarship supports a different reading; it is recorded here rather than left implicit.
