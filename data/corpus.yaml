    shakha: null
    recension: null
    language: sanskrit
    citation_scheme: [shloka]
    citation_scheme_review: true
    scope_notes:
      - A Shiksha work, not a Pratishakhya - a short versified manual of pronunciation rather than a shakha-bound descriptive treatise.
      - Attribution to Panini is traditional; the relationship between this text and the author of the Ashtadhyayi is not established in modern scholarship, and the attribution must be reported as traditional rather than as authorship.
      - Transmitted in more than one recension, differing in verse count and order; the recension must be identified before any verse is cited.
      - Veda and shakha are null because the work is not tied to a single shakha's recitation.
      - SOURCE POSITION - no digital text witness exists at GRETIL or TITUS; Ghosh's 1938 Calcutta edition is the only route, and it carries two commentaries and an English translation.
      - IDENTITY CAUTION ANSWERED IN PART - Ghosh edits the work in ALL FIVE recensions, confirming the text is genuinely multi-recensional. A citation is therefore ambiguous unless it names the recension, and recension stays null until that is decided editorially.
    priority: medium
    status: approved
    sources:
      edition_anchors:
        - sr-paniniya-shiksha-ghosh-anchor
    source_status: partially-verified

