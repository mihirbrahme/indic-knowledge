  # ===============================================================
  # ITIHASA RECORDS
  #
  # THE CENTRAL DISCIPLINE FOR THIS GROUP is that critical-edition and
  # received-text numbering are DIFFERENT SYSTEMS over partly different texts.
  # A critical edition sets aside passages the vulgate carries, so chapters
  # and verses do not line up. A bare reference such as 6.23.1 identifies a
  # passage only once the edition is named. No record here mixes the two.
  #
  # A CRITICAL EDITION IS NOT THE ORIGINAL EPIC. It is an editorially
  # constituted text reconstructed from manuscript comparison. That framing is
  # required by the corpus records and is repeated on every anchor below.
  #
  # NOT ENCODED ANYWHERE IN THIS METADATA, by design: dating, original
  # authorship, interpolation as settled fact, historicity of narrated events,
  # and astronomical dating arguments. Those are editorial claims requiring
  # their own evidence under CLAIM_POLICY.md.
  # ===============================================================

  # === MAHABHARATA ==============================================

