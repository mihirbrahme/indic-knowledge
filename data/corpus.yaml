    scope_notes:
      - The foundational surviving treatise on metre, treating both Vedic and classical metres; the title appears as both Chandahsutra and Chandashastra.
      - Its concluding portion sets out enumeration procedures for metrical patterns. These are of genuine combinatorial interest, but any comparison with modern binary notation, combinatorics, or the Fibonacci sequence is a modern-connection claim requiring history-of-mathematics sourcing under CLAIM_POLICY.md, and must not be read back into the sutras as the text's own claim.
      - The text is extremely terse and has historically been read through its commentaries; commentarial records are deliberately absent at this stage, so any interpretation drawn from this record must be marked as resting on the bare sutra.
      - Dating and the identity of Pingala are historical claims requiring separate sourcing.
      - NO DIGITAL TEXT WITNESS EXISTS at GRETIL or TITUS. The 1874 edition with Halayudha's commentary is the route, which suits a text too terse to read without commentary.
      - Halayudha is a later layer; anything found there is a COMMENTARIAL claim and must never be reported as what the sutras say.
