  # ---------------------------------------------------------------
  # N. Itihasa
  #
  # Standing requirement for this group: a critical edition's constituted text
  # is an editorial reconstruction from manuscript evidence. It is not "the
  # original", and must never be described as recovering one. Critical and
  # received numbering are separate systems; no reference in this group is
  # usable until the edition behind it is stated.
  # ---------------------------------------------------------------

  - id: mahabharata
    title: Mahabharata
    title_devanagari: महाभारत
    family: itihasa
    veda: null
    branch: null
    shakha: null
    recension: null
    language: sanskrit
    citation_scheme: [parvan, adhyaya, shloka]
    citation_scheme_review: true
    scope_notes:
      - EDITION WARNING - the critical edition and the received or vulgate traditions differ materially, not only in readings but in which passages are present at all. Adhyaya and shloka numbering diverges between them, so a bare reference such as 6.23.1 does not identify a passage.
      - Every passage record must state which edition and numbering system it uses, and numbers must never be carried between systems.
      - The critical edition's constituted text is an editorial reconstruction from the manuscript traditions. It must not be presented as the original poem or as what the text once was.
      - Northern and Southern recensional traditions differ substantially; regional transmissions must be identified rather than merged.
      - recension is null because this record is the work, not one of its named recensions; if recension-specific records become necessary they should be split as the Isha and Brihadaranyaka records were.
      - Narrative content is not historical evidence. Claims about events, persons, dating, or historicity require separate historical sourcing under CLAIM_POLICY.md.
      - Carries substantial embedded didactic and philosophical material, of which the Bhagavad Gita is recorded separately; the containment is recorded at bhagavad-gita.embedded_in, not here, because related_to is reserved for non-containment links.
      - The Harivamsha, transmitted in close association with this work and traditionally described as its khila or appendix, is NOT covered by this record. It is tracked as candidate harivamsha in data/corpus-candidates.yaml. This is a prose reference only - no structured link to an unapproved candidate exists - and the Harivamsha must not be cited under this record's numbering or witnesses.
      - SOURCE POSITION - the strongest epic chain in the corpus. The registered witness follows the BORI Critical Edition, and the entire electronic text was corrected by hand by a team working with BORI between 1997 and 2001. Its edition basis is unambiguous, which is what makes edition-aware citation possible here at all.
      - CRITICAL AND RECEIVED ARE SEPARATE SYSTEMS OVER PARTLY DIFFERENT TEXTS. The Critical Edition sets aside material the vulgate carries, so chapters and verses do not line up with the Bombay, Calcutta or Kumbakonam editions. A reference such as 6.23.1 identifies a passage only once the edition is named, and a vulgate passage must never be cited against a critical-edition record.
      - A PASSAGE ABSENT FROM THE CRITICAL EDITION IS NOT THEREBY SPURIOUS - it is vulgate material and must be cited as such. A placeholder record marks that tradition so it can never be filed under the critical-edition witnesses; no specific vulgate edition has yet been identified or inspected.
      - Scholarly translations following the Critical Edition are registered. Older translations such as Ganguli's render the vulgate and will not align with these witnesses.
    priority: high
    status: approved
    sources:
      primary:
        - sr-mbh-indology-ce
      edition_anchors:
        - sr-mbh-bori-anchor
        - sr-mbh-vulgate-note
      translations:
        - sr-mbh-translations
    source_status: verified

